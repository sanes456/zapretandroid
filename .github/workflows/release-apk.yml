name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (тег), например v1.0.1'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Prepare keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Missing secrets::Добавьте секреты KEYSTORE_BASE64 и KEYSTORE_PASSWORD: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/zapret.jks
          printf 'storeFile=keystore/zapret.jks\nstorePassword=%s\nkeyAlias=zapret\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          echo "keystore ready: $(wc -c < keystore/zapret.jks) bytes"

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee gradle-build.log

      - name: Publish build errors
        if: failure()
        run: |
          MSG=$(grep -nE "^FAILURE|What went wrong|^e: |error:|error \[|Cause:|Could not|Failed to|A problem occurred|Execution failed|Unresolved" gradle-build.log | tail -n 40 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ -z "$MSG" ]; then
            MSG=$(tail -n 30 gradle-build.log | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          fi
          echo "::error title=Gradle errors::$MSG"

      - name: Collect APK
        if: success()
        run: |
          mkdir -p out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/zapret-android-${{ inputs.version }}.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk out/zapret-android-${{ inputs.version }}-unsigned.apk
          fi

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk \
              --title "Zapret for Android $TAG" \
              --notes "Установка: скачайте APK ниже и откройте его на телефоне (разрешите установку из неизвестных источников)."
          fi

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: zapret-android-release-apk
          path: out/*.apk
          if-no-files-found: error
