name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee gradle-build.log

      - name: Publish build errors
        if: failure()
        run: |
          MSG=$(grep -nE "^FAILURE|What went wrong|^e: |error:|error \[|Cause:|Could not|Failed to|A problem occurred|> Task .*FAILED|Execution failed|Unresolved" gradle-build.log | tail -n 40 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ -z "$MSG" ]; then
            MSG=$(tail -n 30 gradle-build.log | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          fi
          echo "::error title=Gradle errors::$MSG"

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: zapret-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
